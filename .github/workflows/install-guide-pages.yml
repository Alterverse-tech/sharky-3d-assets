name: Deploy install guide to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-guide-pages.yml"
      - "docs/install/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload install guide
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/install

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
